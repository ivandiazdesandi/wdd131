<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Submit your review of our products—flux capacitor, power laces, time circuits, and more." />
  <meta name="author" content="Ivan Diaz de Sandi Alvarez"/>
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css" />
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <main>
    <h1>Product Review</h1>
    <form id="reviewForm" method="get" action="review.html">
      
      <div class="form-group">
        <label for="product">Product Name <span class="required">*</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product …</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Overall Rating <span class="required">*</span></legend>
        <div class="rating-group">
          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5">☆</label>
          <input type="radio" id="rating4" name="rating" value="4">
          <label for="rating4">☆</label>
          <input type="radio" id="rating3" name="rating" value="3">
          <label for="rating3">☆</label>
          <input type="radio" id="rating2" name="rating" value="2">
          <label for="rating2">☆</label>
          <input type="radio" id="rating1" name="rating" value="1">
          <label for="rating1">☆</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation <span class="required">*</span></label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="form-group">
        <legend>Which features did you find useful? <em>(check all that apply)</em></legend>
        <div class="checkbox-group">
          <input type="checkbox" id="feature-speed" name="features" value="speed">
          <label for="feature-speed">Speed Control</label><br>
          <input type="checkbox" id="feature-safety" name="features" value="safety">
          <label for="feature-safety">Safety Lock</label><br>
          <input type="checkbox" id="feature-efficiency" name="features" value="efficiency">
          <label for="feature-efficiency">Energy Efficiency</label><br>
          <input type="checkbox" id="feature-automation" name="features" value="automation">
          <label for="feature-automation">Auto Calibrate</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="writtenReview">Written Review <em>(optional)</em></label>
        <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
      </div>

      <div class="form-group">
        <label for="userName">Your Name <em>(optional)</em></label>
        <input type="text" id="userName" name="userName">
      </div>

      <div class="form-group">
        <input type="submit" value="Post Review">
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentYear"></span> Ivan Diaz de Sandi Alvarez • Sydney, Australia</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
