<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Filterable Temple Album with lazy loading and category filters." />
  <meta name="author" content="Ivan Diaz de Sandi Alvarez" />
  <title>Filtered Temple Album</title>

  <link rel="stylesheet" href="styles/filtered-temples.css" />
  <link rel="stylesheet" href="styles/filtered-temples-large.css" />

  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>
  <header>
    <h1>Temple Album</h1>
    <button id="menu-toggle" aria-label="Toggle menu">☰</button>
    <nav id="nav-menu">
      <ul>
        <li><a href="#" data-filter="all">Home</a></li>
        <li><a href="#" data-filter="old">Old</a></li>
        <li><a href="#" data-filter="new">New</a></li>
        <li><a href="#" data-filter="large">Large</a></li>
        <li><a href="#" data-filter="small">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Temple Gallery</h2>
    <div id="temple-cards" class="album"></div>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Ivan Diaz de Sandi Alvarez • Sydney, Australia</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
